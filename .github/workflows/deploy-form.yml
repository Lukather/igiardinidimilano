name: Deploy form

# Publishes the public upload form to Cloudflare Workers.
#
# One-time setup, all of it in the repo settings:
#   - secret   CLOUDFLARE_API_TOKEN   token with "Workers Scripts:Edit" + "Workers R2 Storage:Edit"
#   - secret   CLOUDFLARE_ACCOUNT_ID
#   - variable TURNSTILE_SITEKEY      the public site key of the Turnstile widget
#   - secret   TURNSTILE_SECRET       set on the Worker with `wrangler secret put`, not here
#
# Until the API token exists the deploy step is skipped with a notice, so a
# push never turns red for a missing credential.

on:
  push:
    branches: [main]
    paths:
      - 'form/**'
      - '.github/workflows/deploy-form.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-form
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken form must not ship, so the checks run before the build.
      - run: npm run typecheck:form
      - run: npm run test:form

      - name: Build form
        run: npm run build:form
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}

      # Assert on the artefact, and assert *positively*: the test key is a
      # constant in the bundle as the fallback, so grepping for its absence
      # fails even when the real key is configured. What must be true is that
      # the configured key is the one that got baked in.
      - name: Assert the real Turnstile sitekey reached the bundle
        env:
          SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
        run: |
          if [ -z "$SITEKEY" ]; then
            echo "::error::TURNSTILE_SITEKEY non configurata: il form userebbe la chiave di test, che non verifica nulla."
            exit 1
          fi
          if ! grep -rqF "$SITEKEY" form/dist; then
            echo "::error::La sitekey configurata non è finita nel bundle: il form userebbe la chiave di test."
            exit 1
          fi

      - name: Check credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN non configurato: deploy del form saltato."
          fi

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npm run deploy:form
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
