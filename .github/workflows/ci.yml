name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # The upload form is a separate deployable with its own runtime, so it
      # gets its own checks rather than riding on the site's.
      - name: Typecheck form
        run: npm run typecheck:form

      - name: Test form
        run: npm run test:form

      - name: Build form
        run: npm run build:form
